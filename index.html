<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main id="keel" tabindex="-1" aria-live="polite" aria-atomic="true">
    <div id="stage" class="stage">
      <div id="layer-a" class="slide-layer" aria-hidden="true"></div>
      <div id="layer-b" class="slide-layer" aria-hidden="true"></div>
    </div>
  </main>
  <footer id="progress" class="progress" role="status" aria-label="Presentation progress">
    <span id="progress-counter" class="progress__counter"></span>
  </footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
